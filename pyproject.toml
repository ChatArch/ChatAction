[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatAction"
dynamic = ["version"]
description = "ChatAction: ChatArch action orchestration command surface."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1,<9.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.10,<0.3.0",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chataction", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatAction"
Repository = "https://github.com/ChatArch/ChatAction"
Documentation = "https://arch.gh.wzhecnu.cn/ChatAction/"

[project.scripts]
chataction = "chataction.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<10.0",
    "twine>=5.0,<7.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocs-static-i18n>=1.2,<2.0",
    "mike>=2.0,<3.0",
]

[tool.setuptools.dynamic]
version = {attr = "chataction.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
