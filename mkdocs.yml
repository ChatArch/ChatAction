site_name: ChatAction 文档
site_url: https://arch.gh.wzhecnu.cn/ChatAction/
repo_url: https://github.com/ChatArch/ChatAction
repo_name: ChatArch/ChatAction

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatAction 文档
        - locale: en
          name: English
          build: true
          site_name: ChatAction Documentation
          nav_translations:
            首页: Home
            CLI 树: CLI Tree

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra:
  alternate:
    - name: 中文
      link: /ChatAction/
      lang: zh
    - name: English
      link: /ChatAction/en/
      lang: en

nav:
  - 首页: index.md
  - CLI 树: cli-tree.md
